<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  color: white;
  overflow-x: hidden;
  background:
    radial-gradient(circle at top left, rgba(176,90,255,0.9), transparent 35%),
    linear-gradient(135deg, #7a2dff 0%, #6f22ff 35%, #7c1fe8 60%, #c02f7a 100%);
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(rgba(255,255,255,0.8) 1px, transparent 1px),
    radial-gradient(rgba(255,255,255,0.6) 1px, transparent 1px);
  background-size: 140px 140px, 180px 180px, 220px 220px;
  background-position: 0 0, 40px 60px, 100px 120px;
  opacity: 0.45;
  pointer-events: none;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 50px 24px;
  position: relative;
  z-index: 2;
}

.topo { text-align: left; margin-bottom: 35px; }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 24px;
  color: #ffffff;
  backdrop-filter: blur(8px);
}

.topo h1 {
  font-size: 72px;
  line-height: 1.05;
  margin: 0 0 20px;
  font-weight: 900;
}

.sub {
  font-size: 19px;
  color: #f0e8ff;
  max-width: 520px;
  line-height: 1.6;
}

.formulario {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 32px;
  padding: 34px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

.card { margin-bottom: 26px; }

.card label {
  display: block;
  margin-bottom: 12px;
  font-weight: 700;
  font-size: 16px;
}

input {
  width: 100%;
  padding: 18px 20px;
  border: none;
  border-radius: 18px;
  background: rgba(255,255,255,0.92);
  font-size: 16px;
  outline: none;
  transition: 0.2s;
}

input:focus { transform: scale(1.01); }

.gerar {
  width: 100%;
  padding: 20px;
  border: none;
  border-radius: 18px;
  background: linear-gradient(135deg, #ff2f7d, #ff4f98);
  color: white;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 12px 30px rgba(255,47,125,0.35);
}

.gerar:hover { transform: translateY(-2px); }

/* CARTEIRINHA */
.carteirinha {
  position: relative;
  min-height: 480px;
  border-radius: 38px;
  overflow: hidden;
  background: linear-gradient(135deg, #7f36ff 0%, #7a25ff 35%, #8723f2 60%, #c2337b 100%);
  display: flex;
  align-items: flex-start;
  padding: 40px 60px 60px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.35);
}

.estrelas {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(rgba(255,255,255,0.8) 1px, transparent 1px),
    radial-gradient(rgba(255,255,255,0.6) 1px, transparent 1px);
  background-size: 140px 140px, 200px 200px, 260px 260px;
  background-position: 0 0, 80px 60px, 120px 160px;
  opacity: 0.65;
}

.glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
}

.glow-top {
  width: 320px;
  height: 320px;
  background: rgba(179,120,255,0.55);
  top: -120px;
  left: -80px;
}

.glow-bottom {
  width: 360px;
  height: 360px;
  background: rgba(255,77,157,0.35);
  bottom: -180px;
  right: -100px;
}

.conteudo-card {
  position: relative;
  z-index: 2;
  width: 100%;
}

.tag-card {
  display: inline-block;
  margin-bottom: 38px;
  padding: 10px 18px;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(8px);
  font-weight: 800;
  letter-spacing: 1px;
  font-size: 13px;
}

.carteirinha h2 {
  font-size: 58px;
  line-height: 1.08;
  margin: 0 0 28px;
  max-width: 700px;
  font-weight: 900;
}

.nome-card {
  font-size: 30px;
  font-weight: 700;
  color: #ffffff;
  margin: 0;
}

/* LOGO RODAPÉ */
.logo-rodape {
  position: absolute;
  bottom: 28px;
  right: 36px;
  width: 160px;
  z-index: 3;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35));
}

.voltar {
  margin-top: 24px;
  padding: 14px 22px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(8px);
  color: white;
  font-weight: bold;
  transition: 0.2s;
}

.voltar:hover { background: rgba(255,255,255,0.18); }

@media(max-width:768px) {
  .container { padding: 30px 18px; }
  .topo h1 { font-size: 46px; }
  .sub { font-size: 16px; }
  .formulario { padding: 24px; }
  .carteirinha { padding: 30px 30px 80px; min-height: 360px; border-radius: 28px; }
  .tag-card { margin-bottom: 28px; }
  .carteirinha h2 { font-size: 36px; }
  .nome-card { font-size: 22px; }
  .logo-rodape { width: 120px; bottom: 20px; right: 20px; }
}
</style>

<script>
function validar() {
  let nome = document.getElementById("nome").value.trim();
  let clube = document.getElementById("clube").value.trim();
  if (nome === "" || clube === "") {
    alert("Preencha todas as informações 😉");
    return;
  }
  document.getElementById("nomeCarteira").innerText = nome;
  document.getElementById("tituloClube").innerText = "Membro do clube: " + clube;
  document.getElementById("telaForm").style.display = "none";
  document.getElementById("telaCarteirinha").style.display = "block";
}

function voltar() {
  document.getElementById("telaForm").style.display = "block";
  document.getElementById("telaCarteirinha").style.display = "none";
}
</script>

</body>
</html>
